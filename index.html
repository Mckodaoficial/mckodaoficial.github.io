<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>MC KODA — Artista Oficial</title>
  <meta name="description" content="MC KODA é um artista brasileiro de trap, cantor, compositor e produtor. Autenticidade, verdade e evolução no trap nacional." />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet" />

  <!-- Open Graph -->
  <meta property="og:title" content="MC KODA — Site Oficial" />
  <meta property="og:description" content="Trap, verdade e evolução. Conheça MC KODA." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://i.ibb.co/qPNCg0P/foto-1.jpg" />
  <meta property="og:url" content="https://mckodaoficial.github.io/" />

  <style>
    body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#fff;margin:0}

    header{padding:20px 40px;display:flex;justify-content:space-between;align-items:center;background:#111;border-bottom:1px solid #222;position:sticky;top:0;z-index:10}
    .logo{font-size:1.4rem;font-weight:800;letter-spacing:2px}
    nav a{margin-left:20px;color:#bbb;text-decoration:none;font-size:.9rem}
    nav a:hover{color:#fff}

    /* HERO */
    .hero{display:flex;flex-wrap:wrap;padding:90px 40px;align-items:center;justify-content:center;gap:50px;position:relative;overflow:hidden;
      background:radial-gradient(circle at top left,#1a1a1a 0%,#0a0a0a 45%,#060606 100%);border-bottom:1px solid #1a1a1a}
    .hero::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(56,189,248,.08),rgba(168,85,247,.08),rgba(249,115,22,.08))}
    .hero::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;
      background:radial-gradient(circle,rgba(56,189,248,.25),transparent 65%);top:-120px;right:-120px;filter:blur(10px)}
    .hero-text{max-width:520px;position:relative;z-index:1}
    .hero-text h1{font-size:3.4rem;font-weight:800;line-height:1;margin-bottom:18px}
    .hero-text h1 span{display:block;background:linear-gradient(135deg,#38bdf8,#a855f7,#f97316);-webkit-background-clip:text;color:transparent}
    .hero-text p{margin-bottom:26px;font-size:1.05rem;color:#d4d4d8}
    .hero-buttons{display:flex;gap:14px;flex-wrap:wrap}
    .hero-buttons a{padding:13px 24px;border-radius:30px;font-weight:800;text-decoration:none;text-transform:uppercase;font-size:.85rem}
    .btn-primary{background:linear-gradient(135deg,#38bdf8,#a855f7);color:#111}
    .btn-ghost{border:1px solid #3f3f46;color:#f4f4f5;background:#18181b}
    .hero-img img{width:360px;border-radius:24px;border:1px solid #262626;box-shadow:0 20px 50px rgba(0,0,0,.5)}

    section{padding:70px 40px;border-top:1px solid #222}
    h2{text-align:center;font-size:1.9rem;margin-bottom:20px}

    .sobre{max-width:900px;margin:0 auto;line-height:1.7;color:#ddd;text-align:center}

    /* LINKS */
    #links{text-align:center}
    .links-wrapper{max-width:900px;margin:0 auto;padding:40px;background:#111;border:1px solid #333;border-radius:16px}
    .links-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;justify-items:center}
    .link-card{width:100%;max-width:360px;padding:18px;border-radius:14px;background:#18181b;
      border:1px solid #333;color:#fff;text-decoration:none;font-weight:700}
    .link-card:hover{border-color:#38bdf8;box-shadow:0 0 15px #38bdf855}

    /* SHOWS */
    .shows-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;max-width:900px;margin:0 auto}
    .show-card{background:#111;border:1px solid #333;border-radius:16px;padding:30px;text-align:center}
    .show-date{font-weight:900;color:#38bdf8;font-size:1.1rem}
    .show-card a{display:inline-block;margin-top:14px;padding:10px 20px;border-radius:24px;
      background:linear-gradient(135deg,#38bdf8,#a855f7);color:#111;font-weight:900;text-decoration:none}

    footer{text-align:center;padding:20px;border-top:1px solid #222;color:#777;font-size:.8rem}

    /* CTA FIXO */
    .cta-fixo{position:fixed;right:20px;bottom:20px;background:linear-gradient(135deg,#38bdf8,#a855f7);
      color:#111;padding:14px 22px;border-radius:30px;font-weight:900;text-decoration:none;z-index:999}

    @media(max-width:700px){
      .hero-text h1{font-size:2.5rem}
      .hero{padding:50px 20px}
      section{padding:50px 20px}
    }
  </style>
</head>

<body>

<header>
  <div class="logo">MC KODA</div>
  <nav>
    <a href="#links">Links</a>
    <a href="#shows">Shows</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-text">
    <h1><span>MC KODA</span>Trap, verdade e evolução.</h1>
    <p>Artista brasileiro de trap. Das batalhas de rima ao cenário profissional.</p>
    <div class="hero-buttons">
      <a href="https://open.spotify.com/intl-pt/artist/4XENq7z7eVv731ie9vdBSQ" class="btn-primary" target="_blank">Spotify</a>
      <a href="https://www.youtube.com/@Mckodaoficial" class="btn-ghost" target="_blank">YouTube</a>
    </div>
  </div>
  <div class="hero-img">
    <img src="https://i.ibb.co/qPNCg0P/foto-1.jpg" alt="MC KODA">
  </div>
</section>

<section id="links">
  <h2>Plataformas oficiais</h2>
  <div class="links-wrapper">
    <div class="links-grid">
      <a class="link-card" href="https://open.spotify.com/intl-pt/artist/4XENq7z7eVv731ie9vdBSQ" target="_blank">Spotify</a>
      <a class="link-card" href="https://www.instagram.com/mckodaofc/" target="_blank">Instagram</a>
      <a class="link-card" href="https://www.youtube.com/@Mckodaoficial" target="_blank">YouTube</a>
    </div>
  </div>
</section>

<section id="shows">
  <h2>Agenda de shows</h2>
  <div class="shows-grid">
    <div class="show-card">
      <span class="show-date">EM BREVE</span>
      <p>Datas serão divulgadas</p>
      <a href="https://wa.me/55S11913462845" target="_blank">Contato</a>
    </div>
  </div>
</section>

<footer>
  © <span id="year"></span> MC KODA — Site oficial
</footer>

<a href="https://wa.me/5511913462845" target="_blank" class="cta-fixo">
  Contrate MC Koda
</a>

<script>
  document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
